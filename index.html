<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:'Press Start 2P',monospace;user-select:none}button{font-family:inherit;cursor:pointer;touch-action:manipulation}.frame{width:min(100%,520px);height:100dvh;margin:auto;padding:8px;background:linear-gradient(#dc2626,#991b1b);border:3px solid #7f1d1d;border-radius:18px;display:flex;flex-direction:column;gap:7px;box-shadow:0 4px 18px #000b}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7f1d1d;padding:2px 0 7px;gap:5px}.lights{display:flex;align-items:center;gap:4px}.lamp{width:17px;height:17px;border-radius:50%;background:#22d3ee;border:2px solid white;box-shadow:0 0 8px #22d3ee}.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:#ef4444}.dots i:nth-child(2){background:#facc15}.dots i:nth-child(3){background:#22c55e}.stats{font-size:8px;display:flex;gap:7px;background:#0f172a;padding:7px;border:1px solid #475569;border-radius:6px;color:#fde68a;white-space:nowrap}.screen{flex:1;min-height:0;background:#05190e;border:3px solid #334155;border-radius:12px;overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{background:#450a0a;padding:7px;border:2px solid #7f1d1d;border-radius:10px;display:flex;flex-direction:column;gap:6px}.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.poke-btn,.action{background:#0f172a;border:2px solid #475569;color:white;border-radius:7px;padding:5px 2px;min-width:0}.poke-btn.selected{border-color:#facc15;box-shadow:0 0 7px #facc15}.poke-btn img{width:30px;height:30px;object-fit:contain;display:block;margin:auto}.poke-btn span{display:block;font-size:7px;line-height:1.5;overflow:hidden}.poke-btn .cost{color:#fde047}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.action{font-size:7px;padding:9px 2px;background:#334155;border-color:#64748b}.action.green{background:#047857;border-color:#34d399}.action.purple{background:#6b21a8;border-color:#c084fc}.action.gold{background:#92400e;border-color:#fbbf24}.action:disabled{opacity:.35;cursor:not-allowed}.modal{position:absolute;inset:0;background:#020617ed;z-index:5;display:none;flex-direction:column;padding:10px;overflow:auto}.modal.open{display:flex}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fde68a;font-size:11px;margin-bottom:10px}.close{background:#991b1b;border:1px solid #fca5a5;color:white;border-radius:5px;padding:7px;font-size:9px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{background:#111827;border:1px solid #475569;border-radius:7px;padding:8px;text-align:center;font-size:8px;line-height:1.8}.card img{width:52px;height:52px;object-fit:contain;display:block;margin:auto}.card button{font-size:7px;padding:7px;background:#166534;color:white;border:1px solid #4ade80;border-radius:5px;margin-top:5px;width:100%}.muted{color:#94a3b8;font-size:7px;line-height:1.8}.goldtxt{color:#facc15}.rar-common{color:#cbd5e1}.rar-uncommon{color:#4ade80}.rar-rare{color:#60a5fa}.rar-epic{color:#c084fc}.rar-legendary{color:#fbbf24}.modal-note{font-size:8px;line-height:1.8;color:#cbd5e1;margin:0 0 9px}.toast{position:absolute;z-index:8;top:8px;left:8px;right:8px;text-align:center;background:#0f172aee;color:#fde68a;border:1px solid #64748b;border-radius:6px;padding:9px;font-size:8px;line-height:1.6;pointer-events:none;display:none}.subrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.subrow button{font-size:7px;padding:8px;background:#334155;border:1px solid #64748b;color:white;border-radius:5px}

</style></head><body>
<div class="frame"><div class="top"><div class="lights"><div class="lamp"></div><div class="dots"><i></i><i></i><i></i></div></div><div class="stats"><span>💰<b id="money">200</b></span><span>❤️<b id="lives">20</b></span><span>🌊<b id="wave">1</b></span></div><button id="installBtn" class="action green" style="font-size:7px;padding:7px 5px;white-space:nowrap;display:none">📲 INSTALAR</button></div>
<div class="screen"><canvas id="game"></canvas><div class="toast" id="toast"></div>
<div class="modal" id="market"><div class="modal-head"><span>🛒 MERCADO</span><button class="close" onclick="closeModal('market')">FECHAR ✕</button></div><p class="modal-note">Compre itens de captura. Pokémon selvagens aparecem após batalhas.</p><div class="subrow"><button onclick="buyRevive()">💖 REVIVE · 250</button></div><div class="cards" id="marketCards"></div></div>
<div class="modal" id="collection"><div class="modal-head"><span>🎒 COLEÇÃO</span><button class="close" onclick="closeModal('collection')">FECHAR ✕</button></div><p class="modal-note">Toque em USAR e depois escolha um espaço livre na grama para posicionar o Pokémon.</p><div class="cards" id="collectionCards"></div></div>
<div class="modal" id="reviveModal"><div class="modal-head"><span>💖 CONTINUAR?</span></div><p class="modal-note" id="reviveText">Você perdeu todas as vidas.</p><div class="subrow"><button onclick="useRevive()">USAR REVIVE</button><button onclick="closeReviveAndReset()">RECOMEÇAR</button></div></div>
</div>
<div class="controls"><div class="shop" id="shop"></div><div class="actions"><button class="action purple" id="evolve" onclick="evolveSelected()" disabled>⚡ EVOLUIR</button><button class="action gold" id="sell" onclick="sellSelected()" disabled>🪙 VENDER</button><button class="action green" id="waveBtn" onclick="startWave()">▶ ONDA</button><button class="action" id="autoBtn" onclick="toggleAuto()">🤖 AUTO OFF</button><button class="action" onclick="openModal('market')">🛒 MARKET</button></div><div class="actions" style="grid-template-columns:1fr 1fr 1fr 1fr"><button class="action" onclick="openCollection()">🎒 COLEÇÃO</button><button class="action" onclick="saveGame(true)">💾 SALVAR</button><button class="action" id="musicBtn" onclick="toggleMusic()">🎵 MÚSICA OFF</button><button class="action" id="soundBtn" onclick="toggleSfx()">🔊 SONS ON</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const SPRITE='https://play.pokemonshowdown.com/sprites/ani/';
const names={'Pikachu':'pikachu','Raichu':'raichu','Alolan Raichu':'raichu-alola','Charmander':'charmander','Charmeleon':'charmeleon','Charizard':'charizard','Squirtle':'squirtle','Wartortle':'wartortle','Blastoise':'blastoise','Bulbasaur':'bulbasaur','Ivysaur':'ivysaur','Venusaur':'venusaur','Rattata':'rattata','Pidgey':'pidgey','Zubat':'zubat','Geodude':'geodude','Ekans':'ekans','Machop':'machop','Gastly':'gastly','Onix':'onix','Scyther':'scyther','Dragonite':'dragonite','Mewtwo':'mewtwo'};
const imgCache={};function sprite(n){if(!imgCache[n]){let i=new Image();i.src=SPRITE+(names[n]||n.toLowerCase())+'.gif';imgCache[n]=i;}return imgCache[n]}
const DATA={Pikachu:{cost:100,range:110,damage:15,cool:35,type:'electric',next:'Raichu',evolve:100},Raichu:{range:130,damage:35,cool:30,type:'electric',next:'Alolan Raichu',evolve:200},'Alolan Raichu':{range:160,damage:85,cool:25,type:'electric'},Charmander:{cost:120,range:100,damage:12,cool:40,type:'fire',next:'Charmeleon',evolve:120},Charmeleon:{range:125,damage:30,cool:35,type:'fire',next:'Charizard',evolve:220},Charizard:{range:150,damage:75,cool:30,type:'fire'},Squirtle:{cost:90,range:120,damage:10,cool:30,type:'water',next:'Wartortle',evolve:90},Wartortle:{range:140,damage:25,cool:25,type:'water',next:'Blastoise',evolve:180},Blastoise:{range:170,damage:60,cool:20,type:'water'},Bulbasaur:{cost:110,range:100,damage:8,cool:45,type:'grass',next:'Ivysaur',evolve:110},Ivysaur:{range:120,damage:20,cool:40,type:'grass',next:'Venusaur',evolve:200},Venusaur:{range:145,damage:55,cool:35,type:'grass'}};
const WAVES=[['Rattata',3,35,1],['Pidgey',5,50,1.1],['Zubat',7,70,1.2],['Geodude',9,100,1],['Ekans',12,130,1.3],['Machop',15,180,1.1],['Gastly',18,250,1.4],['Onix',22,350,.9],['Scyther',25,500,1.5],['Dragonite',30,800,1.2],['Mewtwo',1,5000,.8]];
const PATH=[[.1,0],[.1,.28],[.85,.28],[.85,.58],[.15,.58],[.15,.82],[.9,.82],[.9,1]];
let money=200,lives=20,wave=1,revives=1,balls=5,greatBalls=0,ultraBalls=0,encounter=null,auto=false,active=false,gameOver=false,spawnLeft=0,nextSpawn=0,selectedType=null,selectedTower=null,placingCaptured=null,towers=[],enemies=[],shots=[],zones=[],sparks=[],collection={},offers=[],lastSave=Date.now(),lastIdle=Date.now(),autoTick=0,toastTimer=0,frame=0;
// Áudio original em estilo chiptune: efeitos curtos e música ambiente leve.
let audioCtx=null,sfxOn=true,musicOn=false,musicTimer=null,musicStep=0;
function audioReady(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return !!audioCtx}
function tone(freq,duration=.09,wave='square',volume=.035,when=0){if(!audioReady())return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+when;o.type=wave;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}
function sfx(kind){if(!sfxOn)return;const seq={attack:[660,880],hit:[440,330],capture:[523,659,784,1047],evolve:[392,523,659,784],boss:[196,147]}[kind]||[520];seq.forEach((f,i)=>tone(f,.065,'square',.018,i*.045))}
const melody=[523.25,659.25,783.99,659.25,587.33,698.46,783.99,698.46,523.25,659.25,880,783.99,698.46,659.25,587.33,523.25];
function musicTick(){if(!musicOn||!audioReady())return;const f=melody[musicStep%melody.length];tone(f,.19,'triangle',.012);if(musicStep%4===0)tone(f/2,.25,'sine',.008);musicStep++}
function toggleMusic(){musicOn=!musicOn;if(musicOn){audioReady();musicStep=0;musicTick();musicTimer=setInterval(musicTick,260)}else{clearInterval(musicTimer);musicTimer=null} $('musicBtn').textContent=musicOn?'🎵 MÚSICA ON':'🎵 MÚSICA OFF';}
function toggleSfx(){sfxOn=!sfxOn;$('soundBtn').textContent=sfxOn?'🔊 SONS ON':'🔇 SONS OFF';if(sfxOn){audioReady();sfx('capture')}}
function resize(){let r=canvas.parentElement.getBoundingClientRect(),ow=canvas.width||r.width,oh=canvas.height||r.height;canvas.width=Math.max(1,Math.floor(r.width));canvas.height=Math.max(1,Math.floor(r.height));let sx=canvas.width/ow,sy=canvas.height/oh;if(ow&&oh){towers.forEach(t=>{t.x*=sx;t.y*=sy});enemies.forEach(e=>{e.x*=sx;e.y*=sy});shots.forEach(p=>{p.x*=sx;p.y*=sy})}}addEventListener('resize',resize);
function point(p){return{x:p[0]*canvas.width,y:p[1]*canvas.height}}
function segDist(px,py,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-a.x-dx*t,py-a.y-dy*t)}
function onPath(x,y){let w=Math.min(canvas.width,canvas.height)*.12;for(let i=0;i<PATH.length-1;i++)if(segDist(x,y,point(PATH[i]),point(PATH[i+1]))<w/2+17)return true;return false}
function canPlace(x,y){return x>20&&y>20&&x<canvas.width-20&&y<canvas.height-20&&!onPath(x,y)&&!towers.some(t=>Math.hypot(t.x-x,t.y-y)<35)}
class Enemy{constructor(cfg,boss=false){this.name=cfg[0];this.maxHp=cfg[2]*(1+Math.max(0,wave-1)*.13);this.hp=this.maxHp;this.speed=cfg[3];this.i=0;this.x=point(PATH[0]).x;this.y=point(PATH[0]).y;this.slow=0;this.burn=0;this.poison=0;this.reward=Math.max(5,Math.round(this.maxHp*.18));this.boss=boss;this.img=sprite(this.name)}update(){if(this.slow>0)this.slow--;if(this.burn>0){this.hp-=.35;this.burn--}if(this.poison>0){this.hp-=.5;this.poison--}if(this.hp<=0)return'dead';let p=PATH[this.i+1];if(!p)return'escaped';let q=point(p),dx=q.x-this.x,dy=q.y-this.y,d=Math.hypot(dx,dy),step=this.speed*1.5*(this.slow>0?.5:1);if(d<=step){this.x=q.x;this.y=q.y;this.i++;if(this.i>=PATH.length-1)return'escaped'}else{this.x+=dx/d*step;this.y+=dy/d*step}return this.hp<=0?'dead':'alive'}draw(){let s=this.boss?46:32;if(this.img.complete&&this.img.naturalWidth)ctx.drawImage(this.img,this.x-s/2,this.y-s/2,s,s);else{ctx.fillStyle=this.boss?'#a855f7':'#ef4444';ctx.beginPath();ctx.arc(this.x,this.y,s/3,0,7);ctx.fill()}ctx.fillStyle='#111827';ctx.fillRect(this.x-17,this.y-s/2-7,34,4);ctx.fillStyle=this.hp>this.maxHp*.4?'#22c55e':'#ef4444';ctx.fillRect(this.x-17,this.y-s/2-7,34*Math.max(0,this.hp/this.maxHp),4)}}
class Tower{constructor(x,y,n){this.x=x;this.y=y;this.name=n;this.cool=0;this.stats()}stats(){let d=DATA[this.name];if(!d){let r=rarityFor(this.name);d={range:r==='Lendário'?155:r==='Épico'?135:105,damage:r==='Lendário'?65:r==='Épico'?38:18,cool:r==='Lendário'?24:36,type:['Pidgey','Scyther','Dragonite'].includes(this.name)?'electric':['Geodude','Onix'].includes(this.name)?'water':['Ekans','Gastly'].includes(this.name)?'grass':'fire'};}this.range=d.range;this.damage=d.damage;this.maxCool=d.cool;this.type=d.type;this.img=sprite(this.name)}update(){if(this.cool>0){this.cool--;return}let target=enemies.filter(e=>Math.hypot(e.x-this.x,e.y-this.y)<=this.range).sort((a,b)=>b.i-a.i)[0];if(target){shots.push({x:this.x,y:this.y,target,damage:this.damage,type:this.type,speed:5,ox:this.x,oy:this.y});this.cool=this.maxCool;if(Math.random()<.22)sfx('attack')}}draw(){if(selectedTower===this){ctx.strokeStyle='#ffffff99';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(this.x,this.y,this.range,0,7);ctx.stroke()}if(this.img.complete&&this.img.naturalWidth)ctx.drawImage(this.img,this.x-18,this.y-18,36,36);else{ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(this.x,this.y,12,0,7);ctx.fill()}}}
function hit(p,e){if(!enemies.includes(e))return;e.hp-=p.damage;if(Math.random()<.32)sfx('hit');if(p.type==='electric'){enemies.filter(x=>x!==e&&Math.hypot(x.x-e.x,x.y-e.y)<70).slice(0,2).forEach(x=>{x.hp-=p.damage*.6;sparks.push({x1:e.x,y1:e.y,x2:x.x,y2:x.y,t:5})});sparks.push({x1:p.ox,y1:p.oy,x2:e.x,y2:e.y,t:5})}if(p.type==='fire')zones.push({x:e.x,y:e.y,r:22,t:35});if(p.type==='water')e.slow=50;if(p.type==='grass')enemies.filter(x=>Math.hypot(x.x-e.x,x.y-e.y)<45).forEach(x=>x.poison=Math.max(x.poison,90))}
function drawMap(){ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#d8a060';ctx.lineWidth=Math.min(canvas.width,canvas.height)*.12;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();PATH.forEach((p,i)=>{let q=point(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}
function say(s){$('toast').textContent=s;$('toast').style.display='block';toastTimer=130}
function updateUI(){ $('money').textContent=Math.floor(money);$('lives').textContent=lives;$('wave').textContent=wave;$('autoBtn').textContent=auto?'🤖 AUTO ON':'🤖 AUTO OFF';$('autoBtn').style.background=auto?'#166534':'#334155';$('waveBtn').disabled=active||gameOver;$('sell').disabled=!selectedTower;$('evolve').disabled=!canEvolve();document.querySelectorAll('.poke-btn').forEach(b=>b.classList.toggle('selected',b.dataset.name===selectedType)) }
function setupShop(){let root=$('shop');root.innerHTML='';['Pikachu','Charmander','Squirtle','Bulbasaur'].forEach(n=>{let b=document.createElement('button');b.className='poke-btn';b.dataset.name=n;b.innerHTML=`<img src="${SPRITE}${names[n]}.gif"><span>${n}</span><span class="cost">💰${DATA[n].cost}</span>`;b.onclick=()=>{selectedType=selectedType===n?null:n;selectedTower=null;placingCaptured=null;updateUI()};root.appendChild(b)})}
function startWave(){if(active||gameOver)return;let c=WAVES[Math.min(wave-1,WAVES.length-1)];active=true;spawnLeft=c[1];nextSpawn=performance.now();if(wave%5===0)sfx('boss');say(wave%5===0?'⚠ CHEFE SE APROXIMANDO!':`ONDA ${wave} INICIADA`);updateUI()}
function canEvolve(){if(!selectedTower)return false;let d=DATA[selectedTower.name];return !!d.next&&money>=d.evolve&&towers.filter(t=>t.name===selectedTower.name).length>=4}
function evolveSelected(){if(!canEvolve())return;let old=selectedTower.name,d=DATA[old];money-=d.evolve;let removed=0;towers=towers.filter(t=>{if(t!==selectedTower&&t.name===old&&removed<3){removed++;return false}return true});selectedTower.name=d.next;selectedTower.stats();sfx('evolve');say(`${old} evoluiu!`);updateUI()}
function sellSelected(){if(!selectedTower)return;towers=towers.filter(t=>t!==selectedTower);selectedTower=null;money+=50;updateUI()}
function toggleAuto(){auto=!auto;if(auto){say('BOT ATIVADO: montando defesa e iniciando ondas.');lastIdle=Date.now()}else say('BOT DESATIVADO.');updateUI();saveGame(false)}
function routeDistance(x,y){let best={d:1e9,progress:0};for(let i=0;i<PATH.length-1;i++){let a=point(PATH[i]),b=point(PATH[i+1]),dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(x-a.x-dx*t,y-a.y-dy*t);if(d<best.d)best={d,progress:i+t}}return best}
function strategicSpot(){let best=null,bestScore=-1e9,step=Math.max(16,Math.min(24,Math.round(Math.min(canvas.width,canvas.height)*.045)));for(let y=22;y<canvas.height-22;y+=step)for(let x=22;x<canvas.width-22;x+=step){if(!canPlace(x,y))continue;const near=routeDistance(x,y);if(near.d>125)continue;let coverage=0;for(let i=0;i<PATH.length;i++){let q=point(PATH[i]),d=Math.hypot(x-q.x,y-q.y);if(d<118)coverage+=(118-d)/118*(i<3?1.45:1)}let early=Math.max(0,1-Math.abs(near.progress-2.1)/3.8)*34;let idealDistance= -Math.abs(near.d-61)*.42;let spacing=0;for(const t of towers)spacing+=Math.max(0,75-Math.hypot(t.x-x,t.y-y))*1.8;let score=coverage*34+early+idealDistance-spacing;if(score>bestScore){bestScore=score;best={x,y,score}}}return best}
function chooseBotPokemon(){const opts=['Squirtle','Pikachu','Bulbasaur','Charmander'].filter(n=>money>=DATA[n].cost);if(!opts.length)return null;const counts=Object.fromEntries(opts.map(n=>[n,towers.filter(t=>t.name===n||DATA[t.name]?.type===DATA[n].type).length]));return opts.sort((a,b)=>{const da=DATA[a],db=DATA[b];const sa=(da.range*.38+da.damage*1.7-da.cool*.45)-counts[a]*17;const sb=(db.range*.38+db.damage*1.7-db.cool*.45)-counts[b]*17;return sb-sa})[0]}
function autoPlace(){if(!auto||gameOver||active||placingCaptured)return;let placed=0,limit=towers.length<4?4:Math.min(18,towers.length+2);while(placed<4&&towers.length<limit){const n=chooseBotPokemon();if(!n)break;const spot=strategicSpot();if(!spot)break;towers.push(new Tower(spot.x,spot.y,n));money-=DATA[n].cost;placed++;sfx('attack')}if(placed)say(`BOT montou defesa: +${placed} Pokémon em posições de cobertura.`);else if(towers.length===0)say('BOT aguardando moedas ou espaço livre.');startWave();updateUI()}
function handlePointer(ev){if(ev.button!==undefined&&ev.button!==0)return;ev.preventDefault();let r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left)*canvas.width/r.width,y=(ev.clientY-r.top)*canvas.height/r.height;let found=towers.find(t=>Math.hypot(t.x-x,t.y-y)<24);if(found){selectedTower=found;selectedType=null;placingCaptured=null;updateUI();return}if(placingCaptured){if(canPlace(x,y)){let n=placingCaptured;collection[n]--;if(collection[n]<=0)delete collection[n];towers.push(new Tower(x,y,n));placingCaptured=null;say(`${n} entrou na batalha!`);closeModal('collection')}else say('Escolha um espaço livre na grama.');updateUI();return}if(selectedType){let cost=DATA[selectedType].cost;if(money>=cost&&canPlace(x,y)){towers.push(new Tower(x,y,selectedType));money-=cost;selectedType=null}else say(money<cost?'Moedas insuficientes.':'Esse local não está livre.');updateUI();return}selectedTower=null;updateUI()}
canvas.addEventListener('pointerdown',handlePointer);
const RARITIES=[['Comum','common',.60],['Incomum','uncommon',.37],['Raro','rare',.20],['Épico','epic',.09],['Lendário','legendary',.02]];
const WILD=[['Pidgey','Comum',40],['Rattata','Comum',45],['Zubat','Comum',50],['Geodude','Incomum',75],['Ekans','Incomum',80],['Machop','Raro',120],['Gastly','Raro',140],['Scyther','Épico',220],['Dragonite','Lendário',400],['Mewtwo','Lendário',600]];
function rarityFor(n){return WILD.find(x=>x[0]===n)?.[1]||'Comum'}function chance(r){return({'Comum':.62,'Incomum':.40,'Raro':.22,'Épico':.10,'Lendário':.02})[r]}
function rollOffers(){offers=[];}
function openModal(id){$(id).classList.add('open');if(id==='market')renderMarket()}function closeModal(id){$(id).classList.remove('open')}
function renderMarket(){let root=$('marketCards');root.innerHTML='';let items=[['Pokébola','Captura básica',50,'poke'],['Great Ball','Chance maior',120,'great'],['Ultra Ball','Chance alta',250,'ultra']];items.forEach(([n,d,c,k])=>{let card=document.createElement('div');card.className='card';card.innerHTML='<div>'+n+'</div><div class="muted">'+d+'</div><div>💰 '+c+'</div><button>COMPRAR</button>';card.querySelector('button').onclick=()=>buyItem(k);root.appendChild(card)});let info=document.createElement('p');info.className='modal-note';info.textContent='Inventário: Pokébolas '+balls+' · Great Balls '+greatBalls+' · Ultra Balls '+ultraBalls;root.appendChild(info)}
function buyItem(type){let cfg={poke:[50,'balls','Pokébola'],great:[120,'greatBalls','Great Ball'],ultra:[250,'ultraBalls','Ultra Ball']}[type];if(!cfg)return;if(money<cfg[0]){say('Moedas insuficientes!');return}money-=cfg[0];if(type==='poke')balls++;else if(type==='great')greatBalls++;else ultraBalls++;say(cfg[2]+' comprada!');renderMarket();updateUI();saveGame(false)}
function createEncounterUI(){if($('encounter'))return;let m=document.createElement('div');m.id='encounter';m.className='modal';m.innerHTML='<div class="modal-head"><span>🌿 ENCONTRO SELVAGEM!</span><button class="close" id="encClose">FECHAR ✕</button></div><p class="modal-note" id="encText"></p><div class="card" id="encCard"></div><p class="modal-note" id="encInventory"></p><div class="subrow" id="encButtons"></div>';document.querySelector('.screen').appendChild(m);$('encClose').onclick=closeEncounter}
function chooseWild(){let pool=WILD.filter(w=>wave<4?w[1]==='Comum':wave<8?['Comum','Incomum'].includes(w[1]):wave<13?['Comum','Incomum','Raro'].includes(w[1]):wave<20?['Incomum','Raro','Épico'].includes(w[1]):true);let weights=pool.map(w=>({w,weight:({'Comum':60,'Incomum':27,'Raro':10,'Épico':2.5,'Lendário':.5})[w[1]]}));let total=weights.reduce((a,x)=>a+x.weight,0),roll=Math.random()*total;for(const x of weights){roll-=x.weight;if(roll<=0)return x.w}return pool[0]||WILD[0]}
function triggerEncounter(){if(encounter||gameOver||Math.random()>Math.min(.24,.08+wave*.006))return;createEncounterUI();let [name,rarity]=chooseWild();encounter={name,rarity};$('encText').textContent='Um Pokémon selvagem apareceu depois da batalha! Escolha uma Pokébola.';$('encCard').innerHTML='<img src="'+SPRITE+(names[name]||name.toLowerCase())+'.gif"><div>'+name+'</div><div class="rar-'+rarity.toLowerCase()+'">'+rarity.toUpperCase()+'</div>';$('encInventory').textContent='🔴 '+balls+' Pokébolas · 🔵 '+greatBalls+' Great Balls · 🟡 '+ultraBalls+' Ultra Balls';let b=$('encButtons');b.innerHTML='';[['poke','Pokébola',balls],['great','Great Ball',greatBalls],['ultra','Ultra Ball',ultraBalls]].forEach(([type,label,count])=>{let btn=document.createElement('button');btn.textContent=label+' ('+count+')';btn.disabled=count<=0;btn.onclick=()=>attemptCapture(type);b.appendChild(btn)});$('encounter').classList.add('open')}
function attemptCapture(type){if(!encounter)return;let key=type==='poke'?'balls':type==='great'?'greatBalls':'ultraBalls';if((key==='balls'?balls:key==='greatBalls'?greatBalls:ultraBalls)<=0)return;if(key==='balls')balls--;else if(key==='greatBalls')greatBalls--;else ultraBalls--;let base=({'Comum':.68,'Incomum':.48,'Raro':.30,'Épico':.16,'Lendário':.07})[encounter.rarity],bonus=({poke:0,great:.16,ultra:.30})[type];if(Math.random()<Math.min(.95,base+bonus)){let n=encounter.name;collection[n]=(collection[n]||0)+1;sfx('capture');say(n+' capturado! Foi para sua coleção.');closeEncounter()}else if(Math.random()<.45){say(encounter.name+' escapou!');closeEncounter()}else{say('A captura falhou, mas ele ainda não fugiu. Tente outra bola.');$('encInventory').textContent='🔴 '+balls+' Pokébolas · 🔵 '+greatBalls+' Great Balls · 🟡 '+ultraBalls+' Ultra Balls';[...$('encButtons').children].forEach((b,i)=>b.disabled=[balls,greatBalls,ultraBalls][i]<=0)}updateUI();saveGame(false)}
function closeEncounter(){encounter=null;if($('encounter'))$('encounter').classList.remove('open')}
function refreshMarket(){renderMarket();}
function buyRevive(){if(money<250){say('Você precisa de 250 moedas.');return}money-=250;revives++;say('1 revive comprado!');updateUI();saveGame(false)}
function openCollection(){renderCollection();openModal('collection')}
function renderCollection(){let root=$('collectionCards');root.innerHTML='';let entries=Object.entries(collection).filter(([n,q])=>q>0);if(!entries.length){root.innerHTML='<p class="modal-note">Sua coleção está vazia. Derrote inimigos para encontrar Pokémon selvagens!</p>';return}entries.forEach(([n,q])=>{let card=document.createElement('div');card.className='card';let rarity=rarityFor(n);card.innerHTML=`<img src="${SPRITE}${names[n]||n.toLowerCase()}.gif"><div>${n}</div><div class="rar-${rarity.toLowerCase()}">${rarity.toUpperCase()}</div><div>Quantidade: ${q}</div><button>USAR NO MAPA</button>`;card.querySelector('button').onclick=()=>{placingCaptured=n;closeModal('collection');say(`Toque na grama para posicionar ${n}.`)};root.appendChild(card)})}
function useRevive(){if(revives<=0){say('Você não tem revives.');return}revives--;lives=5;gameOver=false;$('reviveModal').classList.remove('open');say('Revive usado! Você voltou com 5 vidas.');updateUI();requestAnimationFrame(loop);saveGame(false)}
function closeReviveAndReset(){lives=20;money=200;wave=1;revives=1;auto=false;active=false;gameOver=false;spawnLeft=0;towers=[];enemies=[];shots=[];zones=[];collection={};selectedTower=null;$('reviveModal').classList.remove('open');updateUI();saveGame(false);requestAnimationFrame(loop)}
function endGame(){if(gameOver)return;gameOver=true;active=false;if(revives>0){$('reviveText').textContent=`Você ficou sem vidas. Tem ${revives} revive(s). Use um para recuperar 5 vidas e continuar.`;$('reviveModal').classList.add('open')}else{say('FIM DE JOGO. Sem revives disponíveis.');setTimeout(()=>{if(gameOver)closeReviveAndReset()},2200)}}
function saveGame(show=true){let data={v:3,money,lives,wave,revives,balls,greatBalls,ultraBalls,auto,towers:towers.map(t=>({x:t.x/Math.max(1,canvas.width),y:t.y/Math.max(1,canvas.height),name:t.name})),collection,offers,stamp:Date.now(),lastIdle:Date.now()};try{localStorage.setItem('pokenexus_save_v2',JSON.stringify(data));lastSave=Date.now();if(show)say('Jogo salvo neste dispositivo.')}catch(e){if(show)say('Não foi possível salvar neste navegador.')}}
function loadGame(){try{let raw=localStorage.getItem('pokenexus_save_v2');if(!raw)return;let d=JSON.parse(raw);money=Number.isFinite(d.money)?d.money:200;lives=Number.isFinite(d.lives)?d.lives:20;wave=Math.max(1,d.wave||1);revives=d.revives??1;balls=d.balls??5;greatBalls=d.greatBalls??0;ultraBalls=d.ultraBalls??0;auto=!!d.auto;collection=d.collection||{};offers=Array.isArray(d.offers)?d.offers:[];if(Array.isArray(d.towers))towers=d.towers.filter(t=>DATA[t.name]).map(t=>new Tower(t.x*canvas.width,t.y*canvas.height,t.name));let elapsed=Math.min(8*60*60*1000,Math.max(0,Date.now()-(d.stamp||Date.now())));if(auto&&elapsed>60000){let earned=Math.floor(elapsed/60000)*2;money+=earned;say(`Você voltou! +${earned} moedas de progresso offline.`)}if(!offers.length)rollOffers();}catch(e){console.warn('Save inválido',e)}}
function loop(){if(gameOver)return;frame++;ctx.clearRect(0,0,canvas.width,canvas.height);drawMap();if(active&&spawnLeft>0&&performance.now()>=nextSpawn){let cfg=WAVES[Math.min(wave-1,WAVES.length-1)],boss=wave%5===0&&spawnLeft===1;let enemyCfg=[boss?'Mewtwo':cfg[0],1,boss?cfg[2]*4:cfg[2],boss?cfg[3]*.75:cfg[3]];enemies.push(new Enemy(enemyCfg,boss));spawnLeft--;nextSpawn=performance.now()+(boss?1600:850)}towers.forEach(t=>t.update());shots=shots.filter(p=>{if(!enemies.includes(p.target)||p.target.hp<=0)return false;let dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy);if(d<7){hit(p,p.target);return false}p.x+=dx/d*p.speed;p.y+=dy/d*p.speed;ctx.fillStyle=({electric:'#fde047',fire:'#fb923c',water:'#38bdf8',grass:'#86efac'})[p.type];ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();return true});zones=zones.filter(z=>{ctx.fillStyle='#ef444455';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();enemies.forEach(e=>{if(Math.hypot(e.x-z.x,e.y-z.y)<=z.r)e.burn=Math.max(e.burn,12)});return --z.t>0});sparks=sparks.filter(s=>{ctx.strokeStyle='#fde047';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();return --s.t>0});let survivors=[];for(let e of enemies){let state=e.update();if(state==='alive'){e.draw();survivors.push(e)}else if(state==='dead'){money+=e.reward;triggerEncounter();if(e.boss){money+=150;say('CHEFE DERROTADO! +150 moedas bônus.')}}else lives=Math.max(0,lives-1)}enemies=survivors;towers.forEach(t=>t.draw());if(active&&spawnLeft===0&&enemies.length===0){active=false;let bonus=50+wave*10;if(lives===20)bonus+=25;money+=bonus;if(wave%5===0){money+=100;revives+=1;say(`EVENTO CONCLUÍDO! +${bonus+100} moedas e +1 revive.`)}else say(`ONDA ${wave} concluída! +${bonus} moedas.`);wave++;updateUI();saveGame(false)}if(lives<=0){lives=0;endGame()}if(auto&&!active&&!gameOver&&frame%100===0){autoPlace()}if(auto&&frame%1800===0&&!active&&!gameOver){money+=20;say('Bônus de atividade automática: +20 moedas.')}if(toastTimer>0&&--toastTimer===0)$('toast').style.display='none';if(Date.now()-lastSave>5000)saveGame(false);updateUI();requestAnimationFrame(loop)}
resize();setupShop();rollOffers();loadGame();resize();updateUI();requestAnimationFrame(loop);addEventListener('beforeunload',()=>saveGame(false));document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(false)});
</script>
<div id="updateBanner" style="display:none;position:fixed;z-index:9999;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,440px);background:#111827;border:2px solid #facc15;border-radius:10px;padding:12px;color:white;font:10px Arial,sans-serif;box-shadow:0 5px 25px #000b;text-align:center">
  <span>Nova versão do PokéNexus disponível.</span>
  <button id="updateNow" style="margin-left:10px;background:#15803d;color:white;border:0;border-radius:6px;padding:8px;font-weight:bold">ATUALIZAR</button>
  <button id="updateLater" style="margin-left:5px;background:#374151;color:white;border:0;border-radius:6px;padding:8px">DEPOIS</button>
</div>
<script id="pokenexus-pwa-registration">
(() => {
  if (!('serviceWorker' in navigator)) return;
  let installPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const updateBanner = document.getElementById('updateBanner');
  let waitingWorker = null;
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    if (installBtn) installBtn.style.display = 'inline-block';
  });
  if (installBtn) installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.style.display = 'none';
  });
  navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
    .then((registration) => {
      registration.update().catch(() => {});
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            waitingWorker = worker;
            if (updateBanner) updateBanner.style.display = 'block';
          }
        });
      });
      if (registration.waiting && navigator.serviceWorker.controller) {
        waitingWorker = registration.waiting;
        if (updateBanner) updateBanner.style.display = 'block';
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) registration.update().catch(() => {});
      });
    })
    .catch((error) => console.warn('PWA indisponível:', error));
  if (updateBanner) {
    document.getElementById('updateNow').addEventListener('click', () => {
      if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
    });
    document.getElementById('updateLater').addEventListener('click', () => {
      updateBanner.style.display = 'none';
    });
  }
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
})();
</script>
